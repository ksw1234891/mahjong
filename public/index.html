<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 브라우저 자동 다크모드가 패 색을 뒤집지 않도록 -->
  <meta name="color-scheme" content="only light">
  <title>리치마작</title>
  <meta name="description" content="컴퓨터 상대 3명과 두는 일본식 리치마작">
  <link rel="icon" href="tiles/Chun.svg">
  <link rel="stylesheet" href="style.css?v=78">
</head>
<body>
  <header class="bar">
    <div class="title-wrap">
      <h1>리치마작</h1>
      <span id="setupInfo" class="setup-info" title="현재 게임 설정"></span>
    </div>
    <button id="btnMenu" class="menu-btn" aria-label="설정 메뉴" aria-expanded="false" aria-controls="controls">☰</button>
    <div class="controls" id="controls">
      <select id="mode" aria-label="게임 방식">
        <option value="4p">4인</option>
        <option value="solo18">혼자 18순</option>
        <option value="solo109">혼자 산 전부</option>
      </select>
      <select id="matchType" aria-label="대국 방식">
        <option value="hanchan">반장전</option>
        <option value="tonpuu">동풍전</option>
        <option value="single">한 판씩 (점수 없음)</option>
      </select>
      <select id="oppLevel" aria-label="상대 강도">
        <option value="off">상대: 버리기만</option>
        <option value="easy">상대: 쉬움</option>
        <option value="normal">상대: 보통</option>
        <option value="hard">상대: 어려움</option>
        <option value="expert" selected>상대: 매우 어려움</option>
      </select>
      <button id="btnNew">새 게임</button>
    </div>
  </header>

  <main>
    <section class="table" id="table">
      <div class="seat seat-2"><div class="seat-label">대면 西</div><div class="river-box"><div class="river" id="river2"></div></div></div>
      <div class="seat seat-3"><div class="seat-label">상가 北</div><div class="river-box"><div class="river" id="river3"></div></div></div>
      <div class="center">
        <div class="winds">
          <span class="w w2" id="wind2"><b>西</b>대면</span>
          <span class="w w3" id="wind3"><b>北</b>상가</span>
          <span class="w w1" id="wind1"><b>南</b>하가</span>
          <span class="w w0" id="wind0"><b>東</b>나</span>
        </div>
        <div class="center-info">
          <div class="round-info" id="roundInfo" hidden></div>
          <div class="lcd"><span class="lcd-label">패산</span><b id="left">0</b></div>
          <div class="dora" id="dora"></div>
        </div>
        <div class="stick s0" id="stick0" hidden></div>
        <div class="stick s1" id="stick1" hidden></div>
        <div class="stick s2" id="stick2" hidden></div>
        <div class="stick s3" id="stick3" hidden></div>
      </div>
      <div class="seat seat-1"><div class="seat-label">하가 南</div><div class="river-box"><div class="river" id="river1"></div></div></div>
      <div class="seat seat-0"><div class="seat-label">나 東</div><div class="river-box"><div class="river" id="river0"></div></div></div>
      <!-- 상대 부로: 각자 기준 오른쪽 모서리 (대면=왼쪽 위, 하가=오른쪽 위, 상가=왼쪽 아래) -->
      <div class="opp-melds om1" id="oppMelds1"></div>
      <div class="opp-melds om2" id="oppMelds2"></div>
      <div class="opp-melds om3" id="oppMelds3"></div>
      <div class="callbar idle" id="callbar"></div>
      <!-- 내 차례에 할 수 있을 때만 뜨는 버튼 (쯔모 / 리치 / 깡) -->
      <div class="callbar selfbar idle" id="selfbar">
        <button id="btnTsumo" class="call-btn tsumo" disabled>쯔모</button>
        <button id="btnRiichi" class="call-btn riichi" disabled>리치</button>
        <span id="kanButtons"></span>
      </div>
    </section>

    <section class="status">
      <div id="shantenText" class="shanten"></div>
      <div id="waitText" class="wait"></div>
    </section>

    <section class="hand-wrap">
      <div class="hand-row">
        <div id="hand" class="hand"></div>
        <div id="melds" class="melds"></div>
      </div>
      <div class="actions" id="actions">
        <button id="btnHint" aria-pressed="false" title="타패 후보·유효패 표">힌트</button>
        <button id="btnDanger" aria-pressed="true" title="손패에 마우스를 올리거나 끌 때 잔여 장수·위험률 표시">위험도</button>
        <button id="btnJudge" aria-pressed="false" title="울기·리치를 할지 기대점수로 비교 (시뮬레이션이라 계산이 무거움)">기대값</button>
        <button id="btnAskCalls" aria-pressed="true" title="끄면 퐁·치·깡을 묻지 않고 넘김 (론은 항상 물어봄)">울기 ON</button>
        <button id="btnHelp" class="help-btn" aria-label="버튼 설명 보기" title="버튼 설명">?</button>
      </div>
    </section>

    <section class="panel analysis-panel" id="analysisPanel" hidden>
      <div class="analysis" id="analysis"></div>
    </section>

    <section class="panel hint" id="hintPanel" hidden>
      <div class="label">타패 후보 <span class="muted">(유효패 매수는 보이는 패를 뺀 수)</span></div>
      <table id="hintTable"></table>
    </section>

    <section class="stats" id="stats"></section>
  </main>

  <dialog id="helpDialog" class="help-dialog">
    <div class="help-body">
      <h2>버튼 설명</h2>
      <div id="helpList"></div>
      <div class="dialog-actions"><button id="btnHelpClose" class="primary">닫기</button></div>
    </div>
  </dialog>

  <dialog id="result">
    <div class="result-body">
      <h2 id="resultTitle"></h2>
      <div id="resultHand" class="hand small"></div>
      <div id="resultDetail"></div>
      <div class="dialog-actions"><button id="btnNext" class="primary">다음 판</button></div>
    </div>
  </dialog>

  <script src="mahjong.js?v=78"></script>
  <script src="app.js?v=78"></script>
</body>
</html>
